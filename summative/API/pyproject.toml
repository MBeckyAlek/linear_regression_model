[project]
name = "solar-price-api"
version = "1.0.0"
description = "FastAPI service that predicts the price of a solar device in Kenya (deployed on Render)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.34",
    "scikit-learn==1.6.1",
    "uvicorn>=0.54.0",
]
